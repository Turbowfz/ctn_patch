# 这是 GitHub Actions 工作流：云端一键构建 ctn_patch。
# 想启用：把它放在 .github/workflows/build.yml 推上去即可（网页粘贴也行，
# 不受「token 需要 workflow scope」的限制）。Actions 页 → build-ctn-patch → Run workflow，
# 跑完在本次运行的 Artifacts 里下载 ctn_patch-ko（里面有 .ko 和 zip）。
name: build-ctn-patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'ctn_patch.c'
      - 'Kbuild'
      - 'device_kernel.config'
      - 'Module.symvers.device'
      - 'build.sh'
      - 'daemon/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    # ko 在 debian:13 容器里现编 —— 与本机构建（WSL Debian 13）同一发行版，
    # 编译器用 Debian 仓库自带的 clang-17（同 major 版本，纯本地安装，
    # 不依赖 dl.google.com —— runner 上下载 NDK 大文件实测不可靠）。
    # daemon 三件套（ctnd/fakethreads/fakepkg）是 Android 用户态程序，必须用
    # NDK 的 bionic sysroot 才能编，仓库里带的是本机 Debian 13 + NDK r26b 编好的
    # 产物 —— 打包时直接带上，所以 zip 里全部二进制都是 Debian 出的。
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 120

    steps:
      - name: 取本仓库
        uses: actions/checkout@v4

      - name: 装依赖（容器里是 root，不用 sudo）
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-17 lld-17 llvm-17 \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 git curl
          echo "/usr/lib/llvm-17/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          clang --version | head -1

      - name: 编内核模块 ko（克隆 OnePlusOSS 内核 + modules_prepare + 编译）
        run: |
          bash build.sh \
            --clang /usr/lib/llvm-17/bin/clang \
            --work "$RUNNER_TEMP/ctnwork"

      - name: 打 root 模块 zip（ko 为本次现编；daemon 用仓库内 Debian 预编译产物）
        run: |
          python3 build_zip.py
          ls -la ctn_patch.ko daemon/ctnd daemon/fakethreads ctn_patch.zip

      - name: 汇总产物信息
        if: success()
        run: |
          {
            echo "## ctn_patch 构建结果（debian:13 + clang-17）"
            echo
            echo '```'
            echo "vermagic : $(grep -aom1 'vermagic=[ -~]*' ctn_patch.ko | cut -d= -f2)"
            echo "ko       : $(stat -c%s ctn_patch.ko) 字节  sha256 $(sha256sum ctn_patch.ko | cut -d' ' -f1)"
            echo "ctnd     : $(stat -c%s daemon/ctnd) 字节  sha256 $(sha256sum daemon/ctnd | cut -d' ' -f1)"
            echo "zip      : $(stat -c%s ctn_patch.zip) 字节  sha256 $(sha256sum ctn_patch.zip | cut -d' ' -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ctn_patch-ko
          path: |
            ctn_patch.ko
            ctn_patch.zip
          if-no-files-found: error
