# SPDX-License-Identifier: GPL-2.0-only
name: build-ctn-patch
on:
  workflow_dispatch:
  push:
    paths:
      - 'ctn_patch.c'
      - 'kernel/**'
      - 'Kbuild'
      - 'Makefile'
      - 'build.sh'
      - 'build_zip.py'
      - 'profiles/**'
      - 'daemon/**'
      - 'magisk/**'
      - 'verify.sh'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debian build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip \
            build-essential bc bison flex libssl-dev libelf-dev libsqlite3-dev \
            dwarves python3 git util-linux mksh clang-17 llvm-17 lld-17
      - name: Linux Android NDK r26b
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ndk-download" "$RUNNER_TEMP/ndk-extracted"
          curl --fail --location --retry 3 --connect-timeout 30 \
            https://dl.google.com/android/repository/android-ndk-r26b-linux.zip \
            --output "$RUNNER_TEMP/ndk-download/archive.zip"
          unzip -tq "$RUNNER_TEMP/ndk-download/archive.zip"
          unzip -q "$RUNNER_TEMP/ndk-download/archive.zip" -d "$RUNNER_TEMP/ndk-extracted"
          NDK="$RUNNER_TEMP/ndk-extracted/android-ndk-r26b"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          printf 'NDK=%s\n' "$NDK" >> "$GITHUB_ENV"
          printf '%s\n' "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Host regressions and sanitizers
        run: |
          set -euo pipefail
          CTND_SANITIZERS=required bash daemon/test.sh
          python3 -I -B tests/test_packaging.py
          CTN_TEST_SHELL=mksh python3 -I -B tests/test_packaging.py
          python3 -I -B tests/test_profile_tools.py
      - name: Build both verified ABI profiles from pinned official sources
        run: |
          set -euo pipefail
          for profile in 6.1.141 6.1.157; do
            python3 -I tools/fetch_profile.py --profile "$profile" --out "$RUNNER_TEMP/source-$profile"
            SRC=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"])' "$RUNNER_TEMP/source-$profile/paths.json")
            bash build.sh --profile "$profile" --srcdir "$SRC" \
              --work "$RUNNER_TEMP/work-$profile" \
              --clang "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --jobs 4
          done
      - name: Build Android userspace from source
        run: |
          set -euo pipefail
          bash daemon/build.sh
          bash daemon/build_tools.sh
      - name: Development package only (CI cannot certify real-device runtime)
        run: |
          set -euo pipefail
          python3 -I build_zip.py --development --out "$GITHUB_WORKSPACE/out/ctn_patch-development.zip"
          printf '%s\n' 'Both profiles passed static checks. CI performs no insmod or real-device runtime testing.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidates and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: ctn_patch-debian-development
          path: out/
          if-no-files-found: error
